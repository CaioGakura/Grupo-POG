
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Pokédex</title>

    <link rel="stylesheet" href="navegacao.css">

    <link rel="icon"
          type="image/jpeg"
          href="./assets/pagina/pokemon-individual.jpg">

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Jersey+20&display=swap"
          rel="stylesheet">

</head>

<body>

    <nav>

        <img src="./assets/pagina/download.png"
             alt="Logo da Pokédex">

        <svg class="linha-nav"
             viewBox="0 0 1000 70"
             preserveAspectRatio="none">

            <polyline
                points="0,60 390,60 430,15 1000,15"
                fill="none"
                stroke="black"
                stroke-width="7"
                stroke-linejoin="round"
                stroke-linecap="round"
            />

            <polyline
                points="0,60 390,60 430,15 1000,15"
                fill="none"
                stroke="red"
                stroke-width="3"
            />

        </svg>

    </nav>


    <main>

        <div class="container-imagem-chat">
            <img class="chat"
                 src="./assets/pagina/fundo.jpg"
                 alt="Pokédex">
            <div id="respostaIA" style="display: none;"></div>
        </div>

        <div class="caixa-busca-navegacao">
            <input type="text" id="campoBusca" placeholder="Pergunte sobre Pokemon ou digite um nome...">
            <button id="botaoBusca" onclick="buscarPokemon()">BUSCAR</button>
        </div>

        <ul>

            <li>
                <a href="regiao.html?regiao=kanto">
                    KANTO
                </a>
            </li>

            <li>
                <a href="regiao.html?regiao=johto">
                    JOHTO
                </a>
            </li>

            <li>
                <a href="regiao.html?regiao=hoenn">
                    HOENN
                </a>
            </li>

            <li>
                <a href="regiao.html?regiao=sinnoh">
                    SINNOH
                </a>
            </li>

            <li>
                <a href="regiao.html?regiao=unova">
                    UNOVA
                </a>
            </li>

            <li>
                <a href="regiao.html?regiao=kalos">
                    KALOS
                </a>
            </li>

            <li>
                <a href="regiao.html?regiao=alola">
                    ALOLA
                </a>
            </li>

            <li>
                <a href="regiao.html?regiao=galar">
                    GALAR
                </a>
            </li>

            <li>

                    HISUI

            </li>

            <li>
                <a href="regiao.html?regiao=paldea">
                    PALDEA
                </a>
            </li>

        </ul>

    </main>


    <footer>

        <img src="./assets/pagina/pokemon-individual.jpg"
             alt="Pokémon">

        <svg class="linha-footer"
             viewBox="0 0 1000 70"
             preserveAspectRatio="none">

            <polyline
                points="0,15 390,15 430,60 1000,60"
                fill="none"
                stroke="black"
                stroke-width="7"
                stroke-linejoin="round"
                stroke-linecap="round"
            />

            <polyline
                points="0,15 390,15 430,60 1000,60"
                fill="none"
                stroke="red"
                stroke-width="3"
            />

        </svg>

    </footer>


    <script>
        var chaveGemini = atob("QVEuQWI4Uk42SVVQNUI5ZEZDbUYwZmtiT0xPVXU0cklNNVdaUXYtX0w0ZEVhRXo3bldnRkE=");

        async function buscarPokemon() {
            var input = document.getElementById("campoBusca");
            var texto = input.value.trim();
            var respostaDiv = document.getElementById("respostaIA");

            if (!texto) return;

            if (!texto.includes(" ") && !texto.includes("?") && texto.length < 15) {
                window.location.href = "pokemon.html?nome=" + texto.toLowerCase();
                return;
            }

            respostaDiv.style.display = "block";
            respostaDiv.innerHTML = "Professor Carvalho pensando...";

            try {
                var url = "https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-lite-latest:generateContent?key=" + chaveGemini;
                var corpo = {
                    contents: [{ parts: [{ text: texto }] }],
                    systemInstruction: {
                        parts: [{
                            text: "Voce e o Professor Carvalho da Pokedex. Voce so responde perguntas sobre o universo Pokemon. Seja conciso e amigavel em portugues. Se o usuario perguntar algo que NAO seja sobre Pokemon, diga educadamente: 'Desculpe, so posso falar sobre o universo Pokemon!'"
                        }]
                    }
                };

                var resp = await fetch(url, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(corpo)
                });

                var dados = await resp.json();
                console.log("Resposta Gemini:", dados);
                if (dados.candidates && dados.candidates[0] && dados.candidates[0].content && dados.candidates[0].content.parts) {
                    var textoResposta = "";
                    for (var i = 0; i < dados.candidates[0].content.parts.length; i++) {
                        if (dados.candidates[0].content.parts[i].text) {
                            textoResposta += dados.candidates[0].content.parts[i].text;
                        }
                    }
                    if (textoResposta) {
                        respostaDiv.innerHTML = "<strong>Professor Carvalho:</strong><br>" + textoResposta.replace(/\n/g, "<br>");
                    } else {
                        respostaDiv.innerHTML = "Nao consegui responder agora, tente novamente!";
                    }
                } else if (dados.error) {
                    respostaDiv.innerHTML = "Aviso: " + dados.error.message;
                } else {
                    respostaDiv.innerHTML = "Nao consegui responder agora, tente novamente!";
                }
            } catch (erro) {
                respostaDiv.innerHTML = "Erro ao conectar com a Pokedex.";
            }
        }

        document.getElementById("campoBusca").addEventListener("keyup", function(event) {
            if (event.key === "Enter") {
                buscarPokemon();
            }
        });
    </script>
</body>

</html>
