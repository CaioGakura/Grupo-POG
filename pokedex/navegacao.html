
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Pokédex</title>

    <link rel="stylesheet" href="navegacao.css">

    <link rel="icon"
          type="image/jpeg"
          href="./assets/pagina/pokemon-individual.jpg">

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Jersey+20&display=swap"
          rel="stylesheet">

</head>

<body>

    <nav>

    <img src="./assets/pagina/download.png"
         alt="Logo da Pokédex">

    <div class="pesquisa-topo">

        <input
            type="text"
            id="campoTipo"
            placeholder="Escolha um tipo de Pokémon..."
            readonly
        >

        <div class="lista-tipos-menu" id="listaTiposMenu">

            <a href="tipo.html?tipo=normal">Normal</a>
            <a href="tipo.html?tipo=fire">Fogo</a>
            <a href="tipo.html?tipo=water">Água</a>
            <a href="tipo.html?tipo=electric">Elétrico</a>
            <a href="tipo.html?tipo=grass">Planta</a>
            <a href="tipo.html?tipo=ice">Gelo</a>
            <a href="tipo.html?tipo=fighting">Lutador</a>
            <a href="tipo.html?tipo=poison">Veneno</a>
            <a href="tipo.html?tipo=ground">Terra</a>
            <a href="tipo.html?tipo=flying">Voador</a>
            <a href="tipo.html?tipo=psychic">Psíquico</a>
            <a href="tipo.html?tipo=bug">Inseto</a>
            <a href="tipo.html?tipo=rock">Pedra</a>
            <a href="tipo.html?tipo=ghost">Fantasma</a>
            <a href="tipo.html?tipo=dragon">Dragão</a>
            <a href="tipo.html?tipo=dark">Sombrio</a>
            <a href="tipo.html?tipo=steel">Aço</a>
            <a href="tipo.html?tipo=fairy">Fada</a>

        </div>
    </div>

    <svg class="linha-nav"
         viewBox="0 0 1000 70"
         preserveAspectRatio="none">

        <polyline
            points="0,60 390,60 430,15 1000,15"
            fill="none"
            stroke="black"
            stroke-width="7"
            stroke-linejoin="round"
            stroke-linecap="round"
        />

        <polyline
            points="0,60 390,60 430,15 1000,15"
            fill="none"
            stroke="red"
            stroke-width="3"
        />

    </svg>

</nav>

    <main>

        <div class="container-imagem-chat">
            <img class="chat"
                 src="./assets/pagina/fundo.jpg"
                 alt="Pokédex">
            <div id="respostaIA" style="display: none;"></div>
        </div>

        <div class="caixa-busca-navegacao">
            <input type="text" id="campoBusca" placeholder="Pergunte sobre Pokemon ou digite um nome...">
            <button id="botaoBusca" onclick="buscarPokemon()">BUSCAR</button>
        </div>

        <ul>

            <li>
                <a href="regiao.html?regiao=kanto">
                    KANTO
                </a>
            </li>

            <li>
                <a href="regiao.html?regiao=johto">
                    JOHTO
                </a>
            </li>

            <li>
                <a href="regiao.html?regiao=hoenn">
                    HOENN
                </a>
            </li>

            <li>
                <a href="regiao.html?regiao=sinnoh">
                    SINNOH
                </a>
            </li>

            <li>
                <a href="regiao.html?regiao=unova">
                    UNOVA
                </a>
            </li>

            <li>
                <a href="regiao.html?regiao=kalos">
                    KALOS
                </a>
            </li>

            <li>
                <a href="regiao.html?regiao=alola">
                    ALOLA
                </a>
            </li>

            <li>
                <a href="regiao.html?regiao=galar">
                    GALAR
                </a>
            </li>

            <li>
                <a href="regiao.html?regiao=hisui">
                    HISUI
                </a>
            </li>

            <li>
                <a href="regiao.html?regiao=paldea">
                    PALDEA
                </a>
            </li>

        </ul>

    </main>


    <footer>

        <img src="./assets/pagina/pokemon-individual.jpg"
             alt="Pokémon">

        <svg class="linha-footer"
             viewBox="0 0 1000 70"
             preserveAspectRatio="none">

            <polyline
                points="0,15 390,15 430,60 1000,60"
                fill="none"
                stroke="black"
                stroke-width="7"
                stroke-linejoin="round"
                stroke-linecap="round"
            />

            <polyline
                points="0,15 390,15 430,60 1000,60"
                fill="none"
                stroke="red"
                stroke-width="3"
            />

        </svg>

    </footer>

    <script src="navegacao.js"></script>
</body>

</html>
